{{define "header"}}<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Credentials</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#6b7280; --border:#dde1e7; --accent:#2563eb; --danger:#dc2626; --ok:#15803d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1a1f26; --fg:#e5e7eb; --muted:#9ca3af; --border:#2d343e; --accent:#60a5fa; --danger:#f87171; --ok:#4ade80; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 24px; border-bottom:1px solid var(--border); background:var(--card); display:flex; justify-content:space-between; align-items:center; }
  header a { color:var(--fg); text-decoration:none; font-weight:600; }
  main { max-width:960px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:20px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:13px; }
  tr:last-child td { border-bottom:none; }
  a { color:var(--accent); }
  code, textarea, .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
  .muted { color:var(--muted); }
  .btn { display:inline-block; padding:7px 14px; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--fg); cursor:pointer; text-decoration:none; font:inherit; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.danger { color:var(--danger); border-color:var(--danger); }
  label { display:block; font-weight:500; margin:14px 0 4px; }
  input[type=text], select, textarea { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  textarea { min-height:260px; resize:vertical; }
  .row { display:flex; gap:12px; } .row > * { flex:1; }
  .actions { display:flex; gap:8px; justify-content:space-between; margin-top:18px; }
  .alert { padding:10px 14px; border-radius:6px; margin-bottom:16px; border:1px solid; }
  .alert.err { color:var(--danger); border-color:var(--danger); }
  .alert.ok { color:var(--ok); border-color:var(--ok); }
  .tag { font-size:12px; padding:1px 7px; border:1px solid var(--border); border-radius:10px; color:var(--muted); }
  @media (max-width:600px) { .row { flex-direction:column; gap:0; } .hide-sm { display:none; } }
</style>
</head>
<body>
<header><a href="/admin">🔐 Credentials</a><a class="btn primary" href="/admin/new">+ Nouveau</a></header>
<main>
{{if .Flash}}<div class="alert ok">{{.Flash}}</div>{{end}}
{{if .Error}}<div class="alert err">{{.Error}}</div>{{end}}
{{end}}

{{define "footer"}}
</main>
</body>
</html>
{{end}}
