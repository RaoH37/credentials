# Configuration of the credentials service
# (read with: credentials -config /etc/credentials/config.toml).
# Apply changes with: sudo systemctl restart credentials

# Listen address. Only loopback addresses are accepted
# (127.0.0.1, ::1, localhost): the API has no authentication.
addr = "127.0.0.1:12345"

# SQLite database location.
# The service is sandboxed (ProtectSystem=strict, ProtectHome=yes): only
# /var/lib/credentials is writable. To use another location, add an override
# with "sudo systemctl edit credentials":
#   [Service]
#   ReadWritePaths=/other/directory
db = "/var/lib/credentials/credentials.db"

# The passphrase is NOT stored in this file: it is encrypted by systemd-creds
# (TPM2 + host key) in /etc/credentials/passphrase.cred.
# To set or change it: sudo credentials-passphrase [--change]
